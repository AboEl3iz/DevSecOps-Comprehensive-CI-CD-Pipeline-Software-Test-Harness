name: secure-devsecops-pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Top-level least privilege default permissions
permissions: {}

jobs:
  dev-test-and-lint:
    name: Dev Software Testing & SAST
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'
          check-latest: true
          cache-dependency-path: app/go.sum

      - name: Verify Go module dependencies
        run: |
          cd app
          go mod verify

      - name: Run Go Unit Tests with Code Coverage
        run: |
          cd app
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run Integration Tests
        run: |
          cd app
          go test -v -run TestIntegration_FullFlow ./...

      - name: Run Go Vulnerability Check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd app && govulncheck ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v1.64.8
          working-directory: app

      - name: Secret Scan (Gitleaks)
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz
          ./gitleaks detect --config=config/.gitleaks.toml --redact --verbose

      - name: SAST Scan (Gosec)
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        with:
          args: '-fmt=sarif -out=gosec.sarif ./app/...'

  workflow-security:
    name: Workflow Pinning & Security Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          args: --min-severity=medium --format=sarif .github/workflows/*.yml > zizmor.sarif
        continue-on-error: true

  build-scan-attest:
    name: Hermetic Build, SBOM, Sign & SLSA Attest
    needs: [dev-test-and-lint, workflow-security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: app/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Container Image by Digest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate CycloneDX SBOM (Syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Container Vulnerability Gate (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Attest SLSA Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          predicate-type: "https://cyclonedx.org/bom"
          predicate-path: sbom.cdx.json
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless Image Signing (Sigstore/Fulcio/Rekor)
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}

      - name: Post SBOM to Dependency-Track
        if: vars.DTRACK_URL != ''
        run: |
          curl -sf -X POST "$DTRACK_URL/api/v1/bom" \
            -H "X-Api-Key: $DTRACK_API_KEY" \
            -F "autoCreate=true" \
            -F "projectName=${{ github.event.repository.name }}" \
            -F "projectVersion=${{ github.sha }}" \
            -F "bom=@sbom.cdx.json"
        env:
          DTRACK_URL: ${{ vars.DTRACK_URL }}
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}

  promote-staging:
    name: Verify & Promote to Staging Registry
    needs: build-scan-attest
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify Keyless OIDC Signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/.*@refs/heads/main$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ghcr.io/${{ github.repository }}@${{ needs.build-scan-attest.outputs.digest }}

      - name: Setup Crane CLI
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@latest

      - name: Digest-Preserving Staging Promotion
        run: |
          crane copy \
            ghcr.io/${{ github.repository }}@${{ needs.build-scan-attest.outputs.digest }} \
            ghcr.io/${{ github.repository }}-staging@${{ needs.build-scan-attest.outputs.digest }}
