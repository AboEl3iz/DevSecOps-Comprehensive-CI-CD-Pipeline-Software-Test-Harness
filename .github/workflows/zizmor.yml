name: workflow-security-lint
on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/*.yml'

permissions: {}

jobs:
  zizmor-audit:
    name: Audit Workflow Security & Action Pinning
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run zizmor security linter
        uses: zizmorcore/zizmor-action@51e06d9a930777174dbfa3e250feaa9ad74e477f # v0.1.1
        with:
          args: --min-severity=medium --format=sarif .github/workflows/*.yml > results.sarif
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@df409f7d9260372ab5e19e842896b7e464b9d9ed # v3.27.4
        with:
          sarif_file: results.sarif
