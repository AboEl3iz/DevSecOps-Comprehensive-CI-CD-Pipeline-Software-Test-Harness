version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps):"

  - package-ecosystem: "gomod"
    directory: "/app"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(go):"
